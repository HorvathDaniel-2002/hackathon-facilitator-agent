name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node for local installer and optional app work
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate installer entry point without installing or contacting services
        run: node scripts/install-copilot-agent.mjs --help
