<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <a class="skip-link" href="#main">Skip to workspace</a>

    <p><a href="https://github.com/HorvathDaniel-2002/hackathon-facilitator-agent/tree/main/materials" target="_blank" rel="noopener noreferrer">Open no-install workshop materials</a></p>

  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  <script type="module" src="./app.mjs"></script>
  <script src="./startup.js"></script>
