name: Build one-click Windows desktop

on:
  workflow_dispatch:
  push:
    paths:
      - desktop/**
      - '!desktop/README.md'
      - '!desktop/signing/**'
      - '!desktop/store/**'
      - app/src/lib/auth/**
      - app/src/app/api/desktop-health/**
      - .github/workflows/build-desktop.yml

permissions:
  contents: read

jobs:
  native-payload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run prepare:app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-payload-${{ matrix.arch }}
          path: desktop/payload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  package:
    needs: native-payload
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-payload-x64
          path: desktop/payload-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-payload-arm64
          path: desktop/payload-arm64
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneclick-candidate
          path: |
            desktop/dist-oneclick/*.exe
            desktop/dist-oneclick/*.sha256
          if-no-files-found: error
          retention-days: 3
  native-lifecycle:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        scenario: [fresh, upgrade]
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneclick-candidate
          path: candidate
      - run: npm ci --prefix desktop/e2e-harness --no-audit --no-fund
      - name: Install without arguments, verify automatic launch and full app lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $parameters = @{
            Architecture = '${{ matrix.arch }}'
            Version = $version
            InstallerPath = ".\candidate\Hackathon-Facilitator-Setup-$version.exe"
          }
          if ('${{ matrix.scenario }}' -eq 'upgrade') { $parameters.UpgradeFromPrevious = $true }
          .\desktop\scripts\verify-oneclick.ps1 @parameters
      - name: Retain synthetic lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneclick-evidence-${{ matrix.arch }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/hf-oneclick-${{ matrix.arch }}-${{ matrix.scenario }}/*.json
            ${{ runner.temp }}/hf-oneclick-${{ matrix.arch }}-${{ matrix.scenario }}/*.png
          if-no-files-found: warn
          retention-days: 14
  verified-installer:
    needs: native-lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneclick-candidate
          path: verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneclick-verified-installer
          path: verified/
          if-no-files-found: error
          retention-days: 14
