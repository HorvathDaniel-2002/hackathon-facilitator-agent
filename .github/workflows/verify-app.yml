name: Verify web app

on:
  workflow_dispatch:
  push:
    paths:
      - app/**
      - .github/workflows/verify-app.yml
  pull_request:
    paths:
      - app/**
      - .github/workflows/verify-app.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_PROVIDER: mock
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
